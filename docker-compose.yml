# Деплой только фронта. Подключается к сети бэкенда (education-network).
# Nginx и SSL — на стороне бэкенда. Переменные — в .env и .env.front.

services:
  front:
    image: ${FRONT_IMAGE:-ghcr.io/art-goryanskiy/front-new}:${FRONT_IMAGE_TAG:-latest}
    container_name: education-center-front
    restart: unless-stopped
    env_file: .env.front
    environment:
      NODE_ENV: production
    networks:
      - education-network

networks:
  education-network:
    external: true
    name: back-new_education-network
